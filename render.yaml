services:
  - type: web
    name: sanctuary-audhd-assistant
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    # Keeps the SQLite database (/app/data/assistant.db) across deploys and restarts.
    # Without it, every deploy wipes You/AI choices, AI drafts and the Done history.
    disk:
      name: sanctuary-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8765
      - key: TIMEZONE
        value: Europe/London
      - key: BRIEFING_TIME_LOCAL
        value: "07:30"
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SANCTUARY_PASSWORD
        sync: false
